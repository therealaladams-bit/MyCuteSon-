<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to MyCuteSon.com!</title>
  <style>
    /* ==========================================================================
       1. RETRO WIN95 & RAVE MODE STYLES
       ========================================================================== */
    * {
      box-sizing: border-box;
    }
    
    body {
      background-color: #008080; /* Win95 Classic Teal */
      font-family: "Courier New", Courier, monospace;
      color: #000;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
      cursor: default;
      transition: background-color 0.2s ease;
    }

    /* Rave Mode Flashing Effect */
    body.rave-mode {
      animation: raveRainbow 0.5s infinite linear;
    }

    @keyframes raveRainbow {
      0% { background-color: #ff0000; }
      20% { background-color: #ff00ff; }
      40% { background-color: #0000ff; }
      60% { background-color: #00ffff; }
      80% { background-color: #00ff00; }
      100% { background-color: #ffff00; }
    }

    /* Particle Canvas Overlay */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Windows & Layout */
    .window {
      background: #c0c0c0;
      border: 2px solid #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      width: 100%;
      max-width: 650px;
      margin: 0 auto 20px auto;
      box-shadow: 4px 4px 0px #000;
      position: relative;
    }

    .title-bar {
      background: navy;
      color: white;
      padding: 4px 8px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      user-select: none;
    }

    .title-bar-buttons button {
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: bold;
      line-height: 10px;
      padding: 0;
      background: #c0c0c0;
      border: 1px outset #fff;
      cursor: pointer;
    }

    .window-body {
      padding: 15px;
    }

    /* Character Profile Gallery */
    .character-gallery {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .character-card {
      background: #fff;
      border: 2px inset #808080;
      padding: 8px;
      text-align: center;
      width: 180px;
    }

    .character-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border: 1px solid #000;
    }

    .character-name {
      font-weight: bold;
      margin-top: 5px;
      color: #000080;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      border: 2px inset #fff;
      background: #fff;
      font-family: inherit;
    }

    .btn-retro {
      background: #c0c0c0;
      border: 2px outset #fff;
      padding: 6px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-retro:active {
      border-style: inset;
    }

    .btn-danger {
      background: #ff4d4d;
      color: #fff;
      font-weight: bold;
    }

    /* Guestbook Entry Display */
    .entry-card {
      background: #fff;
      border: 2px inset #808080;
      padding: 10px;
      margin-bottom: 15px;
    }

    .entry-header {
      font-weight: bold;
      border-bottom: 1px dashed #808080;
      padding-bottom: 4px;
      margin-bottom: 8px;
      color: #000080;
    }

    .entry-date {
      font-size: 0.8em;
      color: #666;
      float: right;
    }

    /* Status & Debug UI */
    #status-msg {
      font-weight: bold;
      margin-top: 10px;
    }

    .status-bar {
      border: 2px inset #fff;
      padding: 4px 8px;
      font-size: 11px;
      background: #c0c0c0;
      margin-top: 10px;
    }

    /* Hit Counter */
    .hit-counter {
      background: #000;
      color: #00ff00;
      font-family: "Consolas", monospace;
      padding: 4px 8px;
      border: 2px inset #808080;
      display: inline-block;
      letter-spacing: 2px;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .achievements-panel {
      background: #e0e0e0;
      border: 1px dashed #808080;
      padding: 8px;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Particle Canvas Overlay -->
  <canvas id="particle-canvas"></canvas>

  <!-- WINDOW 1: Profile & Control Window -->
  <div class="window" id="window-profile">
    <div class="title-bar">
      <span>Welcome to MyCuteSon.com!</span>
      <div class="title-bar-buttons">
        <button onclick="alert('MyCuteSon.com System Active!')">?</button>
      </div>
    </div>
    <div class="window-body">
      
      <!-- Character Image Showcase -->
      <div class="character-gallery">
        <div class="character-card">
          <img src="IMG_9494.jpeg" alt="Timmy Burd" id="img-timmy" />
          <div class="character-name">Timmy Burd</div>
        </div>
        <div class="character-card">
          <img src="IMG_9518.jpeg" alt="Milky Robinson" id="img-milky" />
          <div class="character-name">Milky Robinson</div>
        </div>
      </div>

      <!-- Interactive FX & Secret Triggers -->
      <div class="action-bar">
        <button class="btn-retro" onclick="triggerParticles('hearts', 20)">❤️ Hearts</button>
        <button class="btn-retro" onclick="triggerParticles('farts', 20)">💨 Fart</button>
        <button class="btn-retro" onclick="playCuteSound()">🔊 Play cute.mp3</button>
        <button class="btn-retro btn-danger" onclick="doNotClickChallenge()">DO NOT CLICK</button>
      </div>

      <!-- Guestbook Submission Form -->
      <form id="guestbook-form">
        <div class="form-group">
          <label for="author">Your Name / Handle:</label>
          <input type="text" id="author" required placeholder="e.g. xX_CuteFan_Xx" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="message">Your Message:</label>
          <textarea id="message" rows="3" required placeholder="Leave a sweet note!"></textarea>
        </div>
        <button type="submit" class="btn-retro" id="submit-btn">Post Signature! 🚀</button>
      </form>

      <div id="status-msg"></div>

      <!-- System Status Bar -->
      <div class="status-bar">
        <span>Audio Status: <strong id="audio-status">Initializing...</strong></span>
      </div>

      <!-- Achievements & Secret State Panel -->
      <div class="achievements-panel">
        <strong>Achievements Unlocked:</strong>
        <div>
          Signatures: <span id="stat-posts">0</span> | 
          Hearts: <span id="stat-hearts">0</span> | 
          Farts: <span id="stat-farts">0</span> |
          Secrets Found: <span id="stat-secrets">0/1</span>
        </div>
      </div>
    </div>
  </div>

  <!-- WINDOW 2: Guestbook Archive Feed & Counter -->
  <div class="window" id="window-feed">
    <div class="title-bar">
      <span>Guestbook Entries</span>
      <div class="title-bar-buttons">
        <button onclick="fetchEntries()">🔄</button>
      </div>
    </div>
    <div class="window-body">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <span>Hit Counter: <div class="hit-counter" id="hit-counter">000421</div></span>
        <span>Total Entries: <strong id="entry-count">0</strong></span>
      </div>

      <div id="entries-container">Loading entries...</div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       2. CONFIGURATION & DATABASE SETTINGS
       ========================================================================== */
    const BIN_ID = 'YOUR_JSONBIN_BIN_ID';    // Replace with your JSONBin Bin ID
    const API_KEY = 'YOUR_JSONBIN_API_KEY';   // Replace with your JSONBin API Access Key
    const AUDIO_URL = './cute.mp3';            // Relative path to cute.mp3
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const form = document.getElementById('guestbook-form');
    const statusMsg = document.getElementById('status-msg');
    const audioStatus = document.getElementById('audio-status');
    const entriesContainer = document.getElementById('entries-container');
    const entryCount = document.getElementById('entry-count');

    /* Pre-load PNG particle assets */
    const heartImg = new Image();
    heartImg.src = 'heart.png';

    const fartImg = new Image();
    fartImg.src = 'fart.png';

    /* ==========================================================================
       3. AUDIO ENGINE (Web Audio API + HTML5 Fallback)
       ========================================================================== */
    let audioCtx = null;
    let audioBuffer = null;
    let htmlAudioFallback = null;
    let isAudioUnlocked = false;

    async function initAudioEngine() {
      try {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        const response = await fetch(AUDIO_URL);
        if (!response.ok) throw new Error(`HTTP error ${response.status}`);
        const arrayBuffer = await response.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        audioStatus.textContent = 'Ready (Web Audio)';
      } catch (err) {
        console.warn('Fallback to HTML5 Audio:', err);
        audioStatus.textContent = 'Ready (HTML5 Audio)';
        htmlAudioFallback = new Audio(AUDIO_URL);
        htmlAudioFallback.preload = 'auto';
      }
    }

    function unlockAudioContext() {
      if (isAudioUnlocked) return;

      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => {
          isAudioUnlocked = true;
          audioStatus.textContent = 'Unlocked & Active';
        });
      } else {
        isAudioUnlocked = true;
      }

      if (htmlAudioFallback) {
        htmlAudioFallback.play().then(() => {
          htmlAudioFallback.pause();
          htmlAudioFallback.currentTime = 0;
        }).catch(() => {});
      }
    }

    ['click', 'keydown', 'touchstart'].forEach(evt => {
      document.addEventListener(evt, unlockAudioContext, { once: true });
    });

    function playCuteSound() {
      unlockAudioContext();
      if (audioCtx && audioBuffer) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);
        source.start(0);
        return;
      }

      if (htmlAudioFallback) {
        htmlAudioFallback.currentTime = 0;
        htmlAudioFallback.play().catch(e => console.error("Playback error:", e));
      }
    }

    /* ==========================================================================
       4. PARTICLE ENGINE (PNG Image Fallback to Emoji)
       ========================================================================== */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerParticles(type, count = 15) {
      const startX = window.innerWidth / 2;
      const startY = window.innerHeight / 2;

      for (let i = 0; i < count; i++) {
        particles.push({
          x: startX,
          y: startY,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10 - 3,
          size: Math.random() * 20 + 20,
          alpha: 1,
          type: type
        });
      }

      if (type === 'hearts') updateStat('stat-hearts', count);
      if (type === 'farts') updateStat('stat-farts', count);
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.015;

        ctx.globalAlpha = Math.max(0, p.alpha);

        // Render PNGs if available; fallback to emojis
        if (p.type === 'hearts') {
          if (heartImg.complete && heartImg.naturalWidth > 0) {
            ctx.drawImage(heartImg, p.x, p.y, p.size, p.size);
          } else {
            ctx.font = `${p.size}px sans-serif`;
            ctx.fillText('❤️', p.x, p.y);
          }
        } else if (p.type === 'farts') {
          if (fartImg.complete && fartImg.naturalWidth > 0) {
            ctx.drawImage(fartImg, p.x, p.y, p.size, p.size);
          } else {
            ctx.font = `${p.size}px sans-serif`;
            ctx.fillText('💨', p.x, p.y);
          }
        }

        if (p.alpha <= 0) particles.splice(i, 1);
      }
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    /* ==========================================================================
       5. EASTER EGGS: DO NOT CLICK & RAVE MODE
       ========================================================================== */
    function doNotClickChallenge() {
      document.body.classList.toggle('rave-mode');
      triggerParticles('farts', 40);
      playCuteSound();
      updateStat('stat-secrets', 1);
      alert('⚠️ RAVE MODE ACTIVATED! ⚠️');
    }

    /* ==========================================================================
       6. DRAGGABLE WINDOWS CONTROLLER
       ========================================================================== */
    function initDraggableWindows() {
      const windows = document.querySelectorAll('.window');
      windows.forEach(win => {
        const header = win.querySelector('.title-bar');
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

        header.onmousedown = (e) => {
          e.preventDefault();
          pos3 = e.clientX;
          pos4 = e.clientY;

          windows.forEach(w => w.style.zIndex = "1");
          win.style.zIndex = "10";

          document.onmousemove = (e) => {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            win.style.top = (win.offsetTop - pos2) + "px";
            win.style.left = (win.offsetLeft - pos1) + "px";
          };

          document.onmouseup = () => {
            document.onmousemove = null;
            document.onmouseup = null;
          };
        };
      });
    }

    /* ==========================================================================
       7. JSONBIN GUESTBOOK DATA ENGINE
       ========================================================================== */
    async function fetchEntries() {
      if (BIN_ID === 'YOUR_JSONBIN_BIN_ID') {
        entriesContainer.innerHTML = '<p style="color:red;">Enter your BIN_ID and API_KEY to sync live posts.</p>';
        return;
      }

      try {
        const res = await fetch(`${API_URL}/latest`, {
          headers: { 'X-Access-Key': API_KEY }
        });
        if (!res.ok) throw new Error('Failed to load posts');
        const data = await res.json();
        const entries = Array.isArray(data.record?.entries) ? data.record.entries : [];
        renderEntries(entries);
      } catch (err) {
        console.error(err);
        entriesContainer.innerHTML = '<p style="color:red;">Error connecting to Guestbook server.</p>';
      }
    }

    function renderEntries(entries) {
      entryCount.textContent = entries.length;
      if (entries.length === 0) {
        entriesContainer.innerHTML = '<p>No entries yet. Leave the first one!</p>';
        return;
      }

      entriesContainer.innerHTML = entries.slice().reverse().map(entry => `
        <div class="entry-card">
          <div class="entry-header">
            <span>${escapeHTML(entry.author)}</span>
            <span class="entry-date">${entry.timestamp}</span>
          </div>
          <div>${escapeHTML(entry.message)}</div>
        </div>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      unlockAudioContext();

      const author = document.getElementById('author').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!author || !message) return;

      statusMsg.style.color = 'black';
      statusMsg.textContent = 'Posting to guestbook...';

      try {
        const getRes = await fetch(`${API_URL}/latest`, {
          headers: { 'X-Access-Key': API_KEY }
        });
        const currentData = await getRes.json();
        const currentEntries = Array.isArray(currentData.record?.entries) ? currentData.record.entries : [];

        const now = new Date();
        const newEntry = {
          author,
          message,
          timestamp: now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        currentEntries.push(newEntry);

        const putRes = await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': API_KEY
          },
          body: JSON.stringify({ entries: currentEntries })
        });

        if (!putRes.ok) throw new Error('Database write failed');

        statusMsg.style.color = 'green';
        statusMsg.textContent = 'Posted successfully!';
        form.reset();

        playCuteSound();
        triggerParticles('hearts', 25);
        updateStat('stat-posts', 1);
        
        renderEntries(currentEntries);

      } catch (err) {
        console.error(err);
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Error writing entry. Check network or API key.';
      }
    });

    /* ==========================================================================
       8. UTILITIES & METRICS
       ========================================================================== */
    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function updateStat(id, increment = 1) {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = parseInt(el.textContent || 0) + increment;
      }
    }

    function initHitCounter() {
      const countEl = document.getElementById('hit-counter');
      let val = Math.floor(Math.random() * 50) + 400;
      countEl.textContent = String(val).padStart(6, '0');
    }

    /* ==========================================================================
       9. BOOTSTRAP INITIALIZATION
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      initAudioEngine();
      initDraggableWindows();
      initHitCounter();
      fetchEntries();
    });
  </script>
</body>
</html>
