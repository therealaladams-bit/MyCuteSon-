<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyCuteSon Guestbook</title>
  <style>
    /* Classic 90s Guestbook Aesthetic */
    body {
      background-color: #008080;
      font-family: "Courier New", Courier, monospace;
      color: #000;
      padding: 20px;
    }
    .window {
      background: #c0c0c0;
      border: 2px solid #fff;
      border-right-color: #404040;
      border-bottom-color: #404040;
      width: 100%;
      max-width: 650px;
      margin: 0 auto 20px auto;
      box-shadow: 4px 4px 0px #000;
    }
    .title-bar {
      background: navy;
      color: white;
      padding: 4px 8px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .window-body {
      padding: 15px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 6px;
      border: 2px inset #fff;
      background: #fff;
      font-family: inherit;
      box-sizing: border-box;
    }
    .btn-retro {
      background: #c0c0c0;
      border: 2px outset #fff;
      padding: 6px 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-retro:active {
      border-style: inset;
    }
    .entry-card {
      background: #fff;
      border: 2px inset #808080;
      padding: 10px;
      margin-bottom: 15px;
    }
    .entry-header {
      font-weight: bold;
      border-bottom: 1px dashed #808080;
      padding-bottom: 4px;
      margin-bottom: 8px;
      color: #000080;
    }
    .entry-date {
      font-size: 0.8em;
      color: #666;
      float: right;
    }
    #status-msg {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Sign Guestbook Form Window -->
  <div class="window">
    <div class="title-bar">
      <span>Sign the Guestbook!</span>
      <span>[X]</span>
    </div>
    <div class="window-body">
      <form id="guestbook-form">
        <div class="form-group">
          <label for="author">Your Name / Handle:</label>
          <input type="text" id="author" required placeholder="e.g. xX_CoolGuy_Xx">
        </div>
        <div class="form-group">
          <label for="message">Your Message:</label>
          <textarea id="message" rows="4" required placeholder="Leave a note for the site!"></textarea>
        </div>
        <button type="submit" class="btn-retro" id="submit-btn">Post Entry 🚀</button>
      </form>
      <div id="status-msg"></div>
    </div>
  </div>

  <!-- Full Guestbook Feed Window -->
  <div class="window">
    <div class="title-bar">
      <span>Guestbook Entries (<span id="entry-count">0</span>)</span>
    </div>
    <div class="window-body">
      <div id="entries-container">Loading entries...</div>
    </div>
  </div>

  <script>
    // Configuration - Replace with your active JSONBin Bin ID and Access Key
    const BIN_ID = 'YOUR_JSONBIN_BIN_ID';
    const API_KEY = 'YOUR_JSONBIN_API_KEY';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const form = document.getElementById('guestbook-form');
    const statusMsg = document.getElementById('status-msg');
    const entriesContainer = document.getElementById('entries-container');
    const entryCount = document.getElementById('entry-count');

    // 1. Fetch Existing Entries
    async function fetchEntries() {
      try {
        const res = await fetch(`${API_URL}/latest`, {
          headers: { 'X-Access-Key': API_KEY }
        });
        if (!res.ok) throw new Error('Failed to load guestbook entries.');
        const data = await res.json();
        renderEntries(data.record.entries || []);
      } catch (err) {
        entriesContainer.innerHTML = '<p style="color:red;">Error loading entries. Check configuration key.</p>';
      }
    }

    // 2. Render Entries cleanly
    function renderEntries(entries) {
      entryCount.textContent = entries.length;
      if (entries.length === 0) {
        entriesContainer.innerHTML = '<p>No entries yet. Be the first to post!</p>';
        return;
      }
      
      // Show newest first
      entriesContainer.innerHTML = entries.slice().reverse().map(entry => `
        <div class="entry-card">
          <div class="entry-header">
            <span>${escapeHTML(entry.author)}</span>
            <span class="entry-date">${entry.timestamp}</span>
          </div>
          <div class="entry-body">${escapeHTML(entry.message)}</div>
        </div>
      `).join('');
    }

    // 3. Post New Entry with Effects Trigger
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const author = document.getElementById('author').value.trim();
      const message = document.getElementById('message').value.trim();
      
      if (!author || !message) return;

      statusMsg.style.color = 'black';
      statusMsg.textContent = 'Posting to guestbook...';

      try {
        // Retrieve current state
        const getRes = await fetch(`${API_URL}/latest`, {
          headers: { 'X-Access-Key': API_KEY }
        });
        const currentData = await getRes.json();
        const currentEntries = currentData.record.entries || [];

        // Append new entry
        const newEntry = {
          author,
          message,
          timestamp: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        };
        currentEntries.push(newEntry);

        // Update database
        const putRes = await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': API_KEY
          },
          body: JSON.stringify({ entries: currentEntries })
        });

        if (putRes.ok) {
          statusMsg.style.color = 'green';
          statusMsg.textContent = 'Entry posted successfully!';
          form.reset();
          renderEntries(currentEntries);
          
          // Trigger optional sound or heart/fart particle burst here
          triggerPostAnimation();
        } else {
          throw new Error('Save failed');
        }
      } catch (err) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Failed to post entry. Try again!';
      }
    });

    // Utility: XSS prevention
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Interactive Callback Hook
    function triggerPostAnimation() {
      // Plug in custom confetti, sound playback, or window spawns here
      console.log('Entry submitted successfully!');
    }

    // Initial Load
    fetchEntries();
  </script>
</body>
</html>
